# OpenTelemetry Collector (contrib) 0.162.0
# agents (OTel SDK) --OTLP--> this collector --> Prometheus (metrics) / Loki (logs) / Tempo (traces)
#
# Component names follow the 0.16x snake_case naming: otlp_grpc / otlp_http exporters
# (the old "otlp"/"otlphttp" exporter names are deprecated aliases), delta_to_cumulative,
# memory_limiter, file_storage, health_check.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /

  # Agents must send "Authorization: Bearer <token>"
  # (OTEL_EXPORTER_OTLP_HEADERS="Authorization=Bearer <token>"; token in .env).
  bearertokenauth/agents:
    scheme: Bearer
    token: ${env:OTLP_BEARER_TOKEN}

  # Persistent sending queues survive collector restarts / backend outages.
  # The directory must exist and be writable by uid 10001 (see compose init service).
  file_storage:
    directory: /var/lib/otelcol/file_storage
    create_directory: false
    timeout: 2s
    fsync: true                     # queue survives host crashes, not just process restarts
    # Per exporter queue file (3 files -> 768 MiB worst case on the shared docker disk).
    # bbolt can use ~8x the queued bytes for small requests, so keep each exporter's
    # sending_queue.queue_size <= max_size / 8.
    max_size: 268435456             # 256 MiB
    compaction:
      directory: /var/lib/otelcol/file_storage
      on_start: true
      on_rebound: true
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10
      cleanup_on_start: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16     # grpc-go default is 4 MiB
        auth:
          authenticator: bearertokenauth/agents
        tls: &server_tls              # cert/key generated by the compose "certs" service
          cert_file: /tls/server.crt
          key_file: /tls/collector.key
          min_version: "1.2"
          reload_interval: 24h        # pick up a re-issued cert without a restart
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 20971520   # 20 MiB (explicit default)
        auth:
          authenticator: bearertokenauth/agents
        tls: *server_tls

processors:
  # Must be first in every pipeline. Percentages are relative to the container
  # memory limit (cgroup), so set mem_limit on the service.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Claude Code and many SDKs export DELTA temporality; Prometheus needs cumulative.
  delta_to_cumulative:
    max_stale: 30m
    max_streams: 200000

  # Claude Code copies OTEL_RESOURCE_ATTRIBUTES onto every log record; drop the copies that
  # equal the resource value so Loki doesn't store them again as *_extracted metadata.
  transform/dedup_resource_attrs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "host.name") where attributes["host.name"] == resource.attributes["host.name"]
          - delete_key(attributes, "deployment.environment.name") where attributes["deployment.environment.name"] == resource.attributes["deployment.environment.name"]

exporters:
  otlp_http/prometheus:
    # Prometheus native OTLP receiver (needs --web.enable-otlp-receiver);
    # the exporter appends /v1/metrics.
    endpoint: http://prometheus:9090/api/v1/otlp
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s          # retry until delivered; the queue size is the bound
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 33554432      # 32 MiB (<= file_storage max_size / 8)
      num_consumers: 1          # keep samples in order for Prometheus TSDB
      batch:
        flush_timeout: 1s
        sizer: items
        min_size: 2000
        max_size: 10000

  otlp_http/loki:
    # Loki 3.x native OTLP ingestion; the exporter appends /v1/logs.
    endpoint: http://loki:3100/otlp
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 33554432      # 32 MiB
      num_consumers: 4
      batch:
        flush_timeout: 1s
        sizer: bytes
        min_size: 1048576       # 1 MiB
        max_size: 4194304       # 4 MiB

  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 33554432      # 32 MiB
      num_consumers: 4
      batch:
        flush_timeout: 1s
        sizer: bytes
        min_size: 1048576       # 1 MiB
        max_size: 3145728       # 3 MiB, below Tempo's default 4 MiB gRPC receive limit

service:
  extensions: [health_check, file_storage, bearertokenauth/agents]

  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, delta_to_cumulative]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/dedup_resource_attrs]
      exporters: [otlp_http/loki]

