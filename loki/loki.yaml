# Grafana Loki 3.7.8 - monolithic (single binary, default -target=all), filesystem storage.
# Mounted read-only at /etc/loki/loki.yaml; all data lives on a named volume at /loki
# (image dir /loki is owned by 10001:10001, so a fresh named volume is writable).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  # Internal gRPC defaults to 4MB; large structured metadata (Claude Code prompts / tool payloads)
  # would make queries fail with "trying to send message larger than max".
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki            # WAL -> /loki/wal, ruler, etc.
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Logs Drilldown "Patterns" tab
pattern_ingester:
  enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  retention_period: 30d
  allow_structured_metadata: true
  volume_enabled: true          # Logs Drilldown volume / service list
  discover_log_levels: true     # adds detected_level structured metadata
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 1000
  # OTLP log attributes become structured metadata; the 64KB default rejects (drops) records
  # carrying large Claude Code event payloads with HTTP 400.
  max_structured_metadata_size: 256KB
  otlp_config:
    resource_attributes:
      # Replace Loki's built-in default index-label list (which includes high-cardinality
      # service.instance.id, k8s.pod.name, ...) with a short, low-cardinality set.
      # Every other resource/scope/log attribute is stored as structured metadata.
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - deployment.environment
            - deployment.environment.name
            - host.name

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp

analytics:
  reporting_enabled: false

