# Prometheus v3.15.0 - metrics backend for the OTel stack.
# Receives: OTLP metrics pushed by the OTel Collector (/api/v1/otlp/v1/metrics),
#           remote_write from Tempo metrics-generator (/api/v1/write),
#           plus scrapes of the stack components' own /metrics.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Accept native histograms exposed by scraped targets, but keep the classic
  # _bucket/_sum/_count series too so stock Loki/Tempo/Grafana dashboards work.
  scrape_native_histograms: true
  always_scrape_classic_histograms: true

runtime:
  # Replaces the deprecated --log.level flag (reloadable).
  log_level: info

# OTLP -> Prometheus translation (only active with --web.enable-otlp-receiver).
# service.name (+ service.namespace as "<ns>/<name>") -> job,
# service.instance.id -> instance; all other resource attributes go to the
# target_info series, except the ones promoted below, which are copied onto
# every series of that resource.
otlp:
  promote_resource_attributes:
    - service.version
    - deployment.environment
    - deployment.environment.name
    - host.name
    - os.type
  # Also keep service.name / service.namespace / service.instance.id as labels
  # on target_info (they are always turned into job/instance anyway).
  keep_identifying_resource_attributes: true
  # Classic Prometheus naming: dots -> underscores, unit + _total suffixes
  # (claude_code.token.usage -> claude_code_token_usage_tokens_total).
  translation_strategy: UnderscoreEscapingWithSuffixes
  # Keep explicit-bucket histograms as classic _bucket series (dashboard compat).
  convert_histograms_to_nhcb: false

storage:
  tsdb:
    # OTLP/remote-write are push-based: accept late / out-of-order samples
    # from agents with clock skew or retrying exporters.
    out_of_order_time_window: 30m
    # Replaces the deprecated --storage.tsdb.retention.* flags.
    retention:
      time: 15d
      size: 3GB     # size to the docker disk; WAL/head count toward this but are never deleted
  exemplars:
    # Requires --enable-feature=exemplar-storage.
    max_exemplars: 100000

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    scheme: https
    tls_config:
      ca_file: /tls/ca.crt            # CA from the compose "certs" service
      server_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

